<!DOCTYPE html>
<html lang="ja">
<head>

<style>
:root{
  --bg: #171D19;
  --sf: #202923;
  --sf2: #29352D;
  --ink: #E5EAE5;
  --mu: #9AA79C;
  --ln: #39473D;
  --ac: #83B394;
  --ac-glow: rgba(131, 179, 148, 0.18);
  --ac2: #8BC6A0;
  --on: #18221B;
  --dg: #E1847D;
  --warn: #C7A76A;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Zen Maru Gothic", sans-serif;
  font-size:15px;
  line-height:1.6;
  padding-bottom:90px;
}
main{max-width:680px;margin:0 auto;padding:20px 16px}
h1{
  font-size:26px;
  font-weight:900;
  margin:4px 0 2px;
  color: var(--ac);
  letter-spacing:.02em;
}
h2{
  font-size:16px;
  margin:28px 0 10px;
  font-weight:700;
  color: var(--ink);
  display:flex;
  align-items:center;
  gap:8px;
}
h2::before{
  content:"";
  width:8px;
  height:16px;
  background:var(--ac);
  border-radius:4px;
}
.sub{color:var(--mu);margin:0 0 14px;font-size:13px}
.badge{
  display:inline-block;
  padding:4px 12px;
  font-size:11px;
  font-weight:900;
  background:var(--ac);
  color:var(--on);
  border-radius:99px;
  box-shadow: 0 4px 10px var(--ac-glow);
}
.box{
  background:var(--sf);
  border:2px solid var(--ln);
  border-radius:20px;
  padding:18px;
  margin:12px 0;
  box-shadow: 0 8px 20px rgba(255, 107, 107, 0.08);
}
.court{
  border:2px solid var(--ln);
  border-radius:16px;
  margin:12px 0;
  background:var(--sf);
  overflow:hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.03);
}
.court .t{
  background:var(--ac);
  color:var(--on);
  font-size:12px;
  padding:6px 14px;
  font-weight:900;
  letter-spacing:.05em;
}
.court .m{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:16px;
}
.court .m>div:first-child,.court .m>div:last-child{font-weight:700;font-size:15px}
.court .m>div:last-child{text-align:right}
.court .m>div:nth-child(2){
  grid-column:1/-1;
  order:3;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  background: var(--sf2);
  padding: 8px;
  border-radius: 12px;
}
input,select,textarea{
  font:inherit;
  color:var(--ink);
  background:var(--sf);
  border:2px solid var(--ln);
  border-radius:12px;
  padding:10px 14px;
  min-width:0;
  transition: all 0.2s;
}
input:focus-visible,select:focus-visible,textarea:focus-visible{
  border-color:var(--ac);
  outline:none;
  box-shadow:0 0 0 4px var(--ac-glow);
}
input.sc{
  width:56px;
  text-align:center;
  padding:6px 2px;
  font-weight:900;
  font-size:20px;
  color:var(--ac);
}
button{
  font:inherit;
  font-weight:700;
  border:0;
  border-radius:14px;
  padding:12px 20px;
  background:var(--ac);
  color:var(--on);
  cursor:pointer;
  box-shadow:0 4px 15px var(--ac-glow);
  transition: transform 0.1s, filter 0.2s;
}
button:hover{filter:brightness(1.05);transform:translateY(-2px)}
button:active{transform:translateY(0)}
button.g{
  background:transparent;
  color:var(--ink);
  border:2px solid var(--ln);
  box-shadow:none;
}
button.g:hover{background:var(--sf2);border-color:var(--ac)}
button.x{
  background:transparent;
  color:var(--dg);
  padding:6px 10px;
  box-shadow:none;
}
button.pm{
  width:40px;
  height:40px;
  padding:0;
  font-size:22px;
  line-height:1;
  background: var(--sf);
  color: var(--ac);
  border: 2px solid var(--ln);
  box-shadow: none;
}
button.line-btn{
  background:#168A52;
  color:#F2FFF6;
  box-shadow:0 4px 15px rgba(22,138,82,0.2);
}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.row>input{flex:1}
.chip{
  display:inline-flex;
  align-items:center;
  background:var(--sf2);
  border:2px solid var(--ln);
  border-radius:99px;
  padding:6px 10px 6px 14px;
  margin:4px 4px 0 0;
  font-size:13px;
  font-weight:700;
}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:12px 8px;border-bottom:2px solid var(--ln);text-align:left}
th{color:var(--mu);font-weight:700;font-size:12px}
.big{font-size:44px;font-weight:900;color:var(--ac);font-variant-numeric:tabular-nums}
nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:rgba(32,41,35,0.94);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-top:2px solid var(--ln);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom,0px);
  z-index:5;
}
nav button{
  flex:1;
  background:transparent;
  color:var(--mu);
  border-radius:0;
  padding:14px 2px;
  font-size:13px;
  font-weight:700;
  border-top:4px solid transparent;
  box-shadow:none;
}
nav button[aria-selected=true]{
  color:var(--ac);
  border-top-color:var(--ac);
  background:var(--sf2);
}
.win{color:var(--ac2);font-weight:900}
.bye{color:var(--mu);font-size:13px;margin-top:6px}
.ok{color:var(--ac2);font-weight:700}
label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-top:12px}
#bg{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:20px}
#ts{
  position:fixed;
  left:16px;
  right:16px;
  bottom:calc(80px + env(safe-area-inset-bottom,0px));
  background:var(--sf2);color:var(--ink);border:2px solid var(--ac);
  padding:14px 18px;
  border-radius:16px;
  z-index:70;
  display:none;
  font-weight:700;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}
#dg{position:fixed;inset:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
#dg .box{width:100%;max-width:380px;background:var(--sf);border-radius:24px;border:1px solid var(--ln);box-shadow:0 20px 40px rgba(0,0,0,0.35)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:55vh;overflow:auto;padding:4px 2px;margin:10px 0}
.msg{max-width:86%}.msg.me{align-self:flex-end;text-align:right}.msg.ot{align-self:flex-start}
.bub{display:inline-block;text-align:left;white-space:pre-wrap;word-break:break-word;padding:10px 14px;border-radius:18px;background:var(--sf2);border:2px solid var(--ln)}
.msg.me .bub{background:var(--ac);color:var(--on);border-color:var(--ac)}
.meta{font-size:11px;color:var(--mu);margin-top:3px}.meta a{color:inherit;text-decoration:underline}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.lvcard{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--sf);color:var(--ink);border:2px solid var(--ln);border-radius:18px;padding:12px 8px;box-shadow:none;font-weight:700;text-align:center}
.lvcard:hover{border-color:var(--ac);transform:none}

/* ---- Pop Style (Neubrutalism) ---- */
button,input,select{min-height:44px}
button.pm{width:44px;height:44px}
.chip button.x{min-height:44px;min-width:44px}
nav button{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
.ni{font-size:20px;line-height:1}
.stk{position:absolute;z-index:2;font-weight:900;font-size:12px;padding:3px 10px;border:2px solid #000;border-radius:8px;background:#FDE047;color:#000;box-shadow:2px 2px 0 #000;transform:rotate(-6deg);white-space:nowrap;left:-6px;top:-14px}
.stk.r{left:auto;right:-6px;background:#F472B6;transform:rotate(7deg)}
.scard{position:relative;margin-top:22px}
.st{display:inline-block;margin-left:8px;padding:1px 8px;border:2px solid #000;border-radius:99px;background:#F472B6;color:#000;font-size:11px;font-weight:900;transform:rotate(-3deg)}
.lvl{font-size:12px;font-weight:900;padding:2px 10px;border:2px solid #000;border-radius:99px;background:#fff;color:#000;white-space:nowrap}
.hero{position:relative;padding:18px;margin:8px 0 14px}
.hero h1{font-size:24px;line-height:1.35}
.hero-btns{display:grid;gap:10px;margin-top:12px}.hero-btns button{min-height:56px;font-size:16px;width:100%}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 12px;-webkit-overflow-scrolling:touch}
.fchip{flex:0 0 auto;min-height:44px;padding:8px 14px;background:#fff;color:#000;border:3px solid #000;box-shadow:2px 2px 0 #000;font-weight:900}
.fchip.on{background:#F472B6}
.wappen{position:absolute;right:-8px;bottom:-6px;min-width:34px;height:34px;padding:0 6px;display:grid;place-items:center;border:3px solid #000;border-radius:99px;background:#FDE047;color:#000;font-weight:900;font-size:13px;transform:rotate(8deg);box-shadow:2px 2px 0 #000}
.stamp{display:inline-block;margin-top:4px;padding:2px 10px;border:2px solid #000;border-radius:8px;background:#fff;color:#000;font-weight:900;font-size:12px;transform:rotate(-2deg)}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 4px}
.ach-i{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border:3px dashed var(--ln);border-radius:14px;opacity:.55;text-align:center;font-size:12px;transform:rotate(var(--rot,0deg))}
.ach-i span{font-size:26px}.ach-i.on{opacity:1;border:3px solid #000;background:#FDE047;color:#000;box-shadow:3px 3px 0 #000}
.scgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scc{position:relative;display:flex;flex-direction:column;gap:8px;align-items:stretch;padding:12px 8px;border:3px solid var(--ln);border-radius:16px;background:var(--sf);text-align:center}
.scc.srv{border-color:#000;background:#FEF9C3;color:#000;box-shadow:4px 4px 0 #000}
.scn{text-align:center;font-weight:900;width:100%}
.scn-big{font-size:84px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums;text-shadow:4px 4px 0 #FDE047}
.scc.srv .scn-big{text-shadow:4px 4px 0 #F472B6}
.serve{font-weight:900;padding:4px 8px;border:3px solid #000;border-radius:99px;background:#34D399;color:#000;animation:pulse 1.1s infinite}
.recv{font-weight:700;color:var(--mu);padding:4px 8px}
.rally{min-height:56px;font-size:15px}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes cf{0%{transform:translateY(-10vh) rotate(0)}100%{transform:translateY(105vh) rotate(720deg)}}
.cf{position:fixed;top:0;font-size:26px;animation:cf 2.6s linear forwards;z-index:95;pointer-events:none}
.winov{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.winov .box{max-width:360px;width:100%;text-align:center;background:#FDE047;color:#000;border:4px solid #000;box-shadow:6px 6px 0 #000}
.winov h2{justify-content:center;font-size:34px;color:#000}
.demo-ov{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px 24px}
.brwrap{display:flex;gap:26px;overflow-x:auto;padding:12px 4px 18px}
.brc{display:flex;flex-direction:column;justify-content:space-around;gap:14px;min-width:210px}
.brt{font-weight:900;text-align:center;padding:2px 8px;background:#000;color:#FDE047;border-radius:8px}
.brm{position:relative;padding:8px;border:3px solid #000;border-radius:12px;background:#fff;color:#000;box-shadow:3px 3px 0 #000}
.brc:not(:last-child) .brm::after{content:"";position:absolute;right:-29px;top:50%;width:26px;border-top:4px solid #000}
.brl{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 2px;border-bottom:2px solid #ddd;font-size:13px}.brl:last-child{border:0}
.brl.win{background:#FDE047;font-weight:900;border-radius:6px}
.brm input.sc{width:46px;font-size:16px;color:#000}
body.hc{--mu:var(--ink);--ln:var(--ink)}
body.hc .box,body.hc .court{border-width:3px}
body.pop h1{color:#000;background:none;-webkit-text-fill-color:#000;font-weight:900;text-transform:uppercase}
body.pop h2{font-weight:900;text-transform:uppercase}
body.pop h2::before{background:#000;border-radius:0;transform:rotate(-8deg)}
body.pop .box,body.pop .court{border:3px solid #000;box-shadow:4px 4px 0 #000;background:#fff;color:#000}
body.pop .box .sub,body.pop .court .sub{color:#334155}
body.pop button{border:3px solid #000;box-shadow:3px 3px 0 #000;color:#000;background:var(--ac);font-weight:900}
body.pop button:hover{transform:none;filter:none}
body.pop button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
body.pop button.g{background:#fff;color:#000;border:3px solid #000;box-shadow:3px 3px 0 #000}
body.pop button.x{background:transparent;border:0;box-shadow:none;color:#BE123C}
body.pop button.line-btn{background:#4ADE80;color:#000}
body.pop button.pm{background:#fff;color:#000}

body.pop nav button{border:0;box-shadow:none;background:transparent;color:#000;border-top:4px solid transparent;border-radius:0}

body.pop th{color:#000}body.pop td,body.pop th{border-bottom:2px solid #000}

.vs{font-size:26px;font-weight:900;text-align:center}
.awd{position:relative;margin:18px 0;padding:14px;border:4px solid #000;border-radius:16px;box-shadow:5px 5px 0 #000;color:#000;text-align:center}

.medal{font-size:22px}
.mons{display:block;margin:0 auto;max-width:100%;height:auto;overflow:visible}

.hero-img{display:block;width:100%;border:3px solid #000;border-radius:14px}

.scene{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:0 2px;max-width:430px;padding:8px 6px 10px;margin:-4px auto 8px;border-radius:12px;background:linear-gradient(#fff7c2,rgba(255,255,255,0))}

#runner.run{animation:dash 7s linear forwards,hop .5s ease-in-out infinite}
@keyframes dash{from{left:-90px}to{left:100vw}}

@keyframes cheer{0%,100%{transform:none}25%{transform:translateY(-20px) rotate(-10deg)}50%{transform:rotate(10deg)}75%{transform:translateY(-14px) rotate(-6deg)}}

.mon-bob{animation:bob 1.8s ease-in-out infinite}.mon-hop{animation:hop 1.1s ease-in-out infinite}.mon-wiggle{animation:wiggle 1.2s ease-in-out infinite}.mon-float{animation:float 3s ease-in-out infinite}.mon-spin{animation:spin 4s ease-in-out infinite}.mon-none{animation:none}

async function rpc0(fn,args){const{data,error}=await supabaseClient.rpc(fn,args);if(error)throw error;return data}
async function reloadState(redraw=true,notify=false){const st=await rpc("get_state"),keep={};LOCAL_KEYS.forEach(k=>{if(S[k]!==undefined)keep[k]=S[k]});const old=S;S=Object.assign(defaultS(),st,keep);if(notify){try{notifyDiff(old,S)}catch(e){}}if(redraw)draw()}
async function flushSave(){
  if(!loaded||!TOKEN)return false;
  const out={...S};LOCAL_KEYS.forEach(k=>delete out[k]);
  try{
    const r=await rpc("save_state",{p_data:out,p_expected:+S._v||0});
    if(r&&r.ok){S._v=r.v;return true}
    if(r&&r.conflict){await reloadState();toast("他の人が先に更新したため、最新の内容に更新しました。もう一度操作してください");return false}
  }catch(e){
    console.error(e);
    if(String(e.message||"").includes("forbidden")){toast("この操作は管理者のみ可能です");try{await reloadState()}catch(x){}}
    else if(!String(e.message||"").includes("unauthorized"))toast("保存できませんでした。通信状況を確認してください");
  }
  return false}
const save=()=>{pending++;saveQ=saveQ.then(flushSave).catch(e=>{console.error(e);return false}).finally(()=>{pending--});return saveQ};

async function poll(){
  if(document.hidden||!loaded||pending>0)return;
  try{
    const p=await rpc("get_poll"),prev=pollKey?JSON.parse(pollKey):null;pollKey=JSON.stringify(p);
    if(!prev){return}
    let changed=false;
    if(p.v!==prev.v||p.a!==prev.a){await reloadState(false,true);changed=true}
    if(p.b!==prev.b||p.d!==prev.d){await refreshRows(true);changed=true}
    if(changed)draw()
  }catch(e){console.error(e)}}

function stats(){
const g=S.players.map(()=>0),pc={},oc={};
S.rounds.forEach(r=>r.m.forEach(m=>{[...m.a,...m.b].forEach(i=>g[i]++);
[m.a,m.b].forEach(t=>{const k=t.slice().sort((p,q)=>p-q).join(":");pc[k]=(pc[k]||0)+1});
m.a.forEach(x=>m.b.forEach(y=>{const k=[x,y].sort((p,q)=>p-q).join(":");oc[k]=(oc[k]||0)+1}))}));
return{g,pc,oc}}
function makeTournamentTeams(roster=tournamentPlayers()){
const ranked=roster.slice().sort((a,b)=>((S.rt&&S.rt[S.players[b]])||3)-((S.rt&&S.rt[S.players[a]])||3));
const teams=[];
while(ranked.length>=2)teams.push([ranked.shift(),ranked.pop()]);
if(ranked.length)teams.push([ranked[0]]);
S.tournamentTeams=teams;
return teams
}
function nextRound(force){
const roster=tournamentPlayers(),n=roster.length,singles=S.tournamentFormat==="singles";if(n<(singles?2:4)){alert(singles?"選択したレベル帯にシングルス参加者が2人以上必要です":"選択したレベル帯にダブルス参加者が4人以上必要です");return}
const lr=S.rounds[S.rounds.length-1];if(!force&&lr&&lr.m.some(m=>m.sa===""||m.sb==="")){ask("前のラウンドにスコア未入力の試合があります。このまま進みますか？",()=>nextRound(true));return}
const R=i=>(S.rt&&S.rt[S.players[i]])||3;
const{g,pc,oc}=stats(),byeCount=S.players.map(()=>0);
S.rounds.forEach(round=>round.bye.forEach(i=>{if(byeCount[i]!=null)byeCount[i]++}));
let matches=[],bye=[];
if(singles){
const matchCount=Math.min(Math.max(1,S.courts),Math.floor(n/2)),playingCount=matchCount*2;
const ordered=roster.map(i=>({i,g:g[i],rest:byeCount[i],tie:Math.random()})).sort((a,b)=>a.g-b.g||b.rest-a.rest||a.tie-b.tie);
const active=ordered.slice(0,playingCount).map(item=>item.i),activeSet=new Set(active);
bye=roster.filter(i=>!activeSet.has(i));
let best=null,bestScore=Infinity;
for(let attempt=0;attempt<500;attempt++){
const shuffled=active.slice().sort(()=>Math.random()-.5);let score=0,roundMatches=[];
for(let i=0;i<shuffled.length;i+=2){const a=shuffled[i],b=shuffled[i+1],key=[a,b].sort((x,y)=>x-y).join(":");score+=(oc[key]||0)**2*25+Math.abs(R(a)-R(b))*4;roundMatches.push({a:[a],b:[b],sa:"",sb:""})}
if(score<bestScore){bestScore=score;best=roundMatches}
}
matches=best||[];
}else{
const rosterSet=new Set(roster);
const validTeams=Array.isArray(S.tournamentTeams)&&S.tournamentTeams.length&&S.tournamentTeams.flat().length===n&&new Set(S.tournamentTeams.flat()).size===n&&S.tournamentTeams.flat().every(i=>rosterSet.has(i))&&S.tournamentTeams.every(team=>team.length===2&&team.every(i=>i>=0&&i<S.players.length));
if(n%2===0){
const teams=validTeams?S.tournamentTeams:makeTournamentTeams(roster);
const activeCount=Math.min(Math.max(1,S.courts),Math.floor(teams.length/2))*2;
const ordered=teams.map((team,index)=>({team,index,games:team.reduce((sum,i)=>sum+g[i],0),rest:team.reduce((sum,i)=>sum+byeCount[i],0),tie:Math.random()})).sort((a,b)=>a.games-b.games||b.rest-a.rest||a.tie-b.tie);
const active=ordered.slice(0,activeCount).map(item=>item.team),activeIds=new Set(active.flat());
bye=roster.filter(i=>!activeIds.has(i));
let best=null,bestScore=Infinity;
for(let attempt=0;attempt<500;attempt++){
const shuffled=active.slice().sort(()=>Math.random()-.5);let score=0,roundMatches=[];
for(let i=0;i<shuffled.length;i+=2){
const a=shuffled[i],b=shuffled[i+1];
const matchupKey=[a.join(":"),b.join(":")].sort().join("|");
let repeats=0;
S.rounds.forEach(round=>round.m.forEach(match=>{const key=[match.a.slice().sort((x,y)=>x-y).join(":"),match.b.slice().sort((x,y)=>x-y).join(":")].sort().join("|");if(key===matchupKey)repeats++}));
score+=repeats*30;
for(const x of a)for(const y of b){const key=[x,y].sort((u,v)=>u-v).join(":");score+=(oc[key]||0)**2*5}
score+=Math.abs(R(a[0])+R(a[1])-R(b[0])-R(b[1]))*4;
roundMatches.push({a:a.slice(),b:b.slice(),sa:"",sb:""})
}
if(score<bestScore){bestScore=score;best=roundMatches}
}
matches=best||[]
}else{
S.tournamentTeams=[];

for(let i=0;i<shuffled.length;i+=4){

[[a,x],[a,y],[b,x],[b,y]].forEach(([u,v])=>score+=(oc[pairKey(u,v)]||0)**2*5);

roundMatches.push({a:[a,b],b:[x,y],sa:"",sb:""})
}

}
matches=best||[]
}

function table(){

m.b.forEach(i=>{t[i].g++;t[i].d-=df;df<0?t[i].w++:df>0&&t[i].l++})}));

function pairTable(){
const pairs={};
S.rounds.forEach(round=>round.m.forEach(match=>{
if(match.sa===""||match.sb==="")return;
[[match.a,match.sa,match.sb],[match.b,match.sb,match.sa]].forEach(([team,score,against])=>{
const ids=team.slice().sort((a,b)=>a-b),key=ids.join(":");
const pair=pairs[key]||(pairs[key]={ids,g:0,w:0,l:0,scored:0,against:0});
pair.g++;pair.scored+=+score;pair.against+=+against;
if(+score>+against)pair.w++;else if(+score<+against)pair.l++
})

}

async function digestProfilePin(name,pin,salt){
if(!crypto.subtle)throw new Error("この環境では安全なPIN処理を利用できません");
const bytes=new TextEncoder().encode(`pickle-hub-profile-v1:${name}:${salt}:${pin}`);
const key=await crypto.subtle.importKey("raw",bytes,"PBKDF2",false,["deriveBits"]);
const saltBytes=new Uint8Array(salt.match(/.{2}/g).map(value=>parseInt(value,16)));
const digest=await crypto.subtle.deriveBits({name:"PBKDF2",salt:saltBytes,iterations:120000,hash:"SHA-256"},key,256);
return [...new Uint8Array(digest)].map(byte=>byte.toString(16).padStart(2,"0")).join("")
}
async function unlockProfile(){
const name=$("profile_member").value;if(!name){alert("メンバーを選択してください");return}
const profile=profileData(name);
if((profile.pinLockUntil||0)>Date.now()){alert("PIN入力を一時停止中です。しばらくしてから再試行してください。");draw();return}
if(profile.pinLockUntil){profile.pinLockUntil=0;profile.pinFailures=0;save()}
try{
if(profile.pinHash){
const pin=$("profile_pin").value;
if(!/^\d{4,8}$/.test(pin)){alert("PINを入力してください");return}
const hash=await digestProfilePin(name,pin,profile.pinSalt);
if(hash!==profile.pinHash){registerProfileAuthFailure(profile);return}
profile.pinFailures=0;profile.pinLockUntil=0;save()
}else{
if(!profile.setupCodeHash||profile.setupCodeUsed){alert("先に管理者から初回設定コードを発行してもらってください");return}
const code=$("profile_setup_code").value,newPin=$("profile_new_pin").value,confirm=$("profile_new_pin_confirm").value;
if(!/^\d{8}$/.test(code)){alert("8桁の初回設定コードを入力してください");return}
if(!/^\d{4}$/.test(newPin)||newPin!==confirm){alert("自分の4桁PINを2回同じ内容で入力してください");return}
const setupHash=await digestProfilePin(name,code,profile.setupSalt);
if(setupHash!==profile.setupCodeHash){registerProfileAuthFailure(profile,"初回設定コードが違います");return}
const salt=[...crypto.getRandomValues(new Uint8Array(16))].map(byte=>byte.toString(16).padStart(2,"0")).join("");
profile.pinSalt=salt;profile.pinHash=await digestProfilePin(name,newPin,salt);profile.pinLength=4;profile.setupCodeHash="";profile.setupCodeUsed=true;profile.setupSalt="";profile.pinFailures=0;profile.pinLockUntil=0;logMemberUpdate(name,"本人PIN初回設定");save()
}
profileUnlockedName=name;profileSessionName=name;S.profileMember=name;profileAnswersEditedName="";profileBaseline={rating:S.rt&&S.rt[name]!=null?Number(S.rt[name]):null,answers:(S.levelAnswers&&S.levelAnswers[name]||[]).slice(),bio:profile.bio||"",avatar:profile.avatar||""};save();draw()
}catch(error){alert(error.message||"PINを確認できませんでした")}
}
function registerProfileAuthFailure(profile,message="PINが違います"){
profile.pinFailures=(profile.pinFailures||0)+1;
if(profile.pinFailures>=5){profile.pinFailures=0;profile.pinLockUntil=Date.now()+5*60*1000}
save();alert(profile.pinLockUntil?"5回間違えたため5分間停止します":message);draw()
}

const url=URL.createObjectURL(file),img=new Image();
img.onload=()=>{const M=512,r=Math.min(1,M/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*r)),h=Math.max(1,Math.round(img.height*r)),c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);profilePhotoDraft=c.toDataURL("image/jpeg",0.85);URL.revokeObjectURL(url);const p=$("profile_preview");if(p){p.src=profilePhotoDraft;p.style.display="block"}};

}

function growthBlock(name,sel=true){
const hist=S.levelHistory&&S.levelHistory[name]||[],cur=S.levelAnswers&&S.levelAnswers[name];
if(!Array.isArray(cur)||cur.length!==5||cur.some(v=>!Number.isFinite(+v)))return '<p class="sub">5項目の自己評価を保存するとチャートが表示されます。</p>';
const none=sel&&S.radarCompareIndex===-9;
const ci=sel&&Number.isInteger(S.radarCompareIndex)&&S.radarCompareIndex>=0&&S.radarCompareIndex<hist.length?S.radarCompareIndex:hist.length-1;
const prev=none||ci<0?null:hist[ci],cr=S.rt&&S.rt[name];
const pick=sel&&hist.length?`<label>比較する過去の評価<select onchange="S.radarCompareIndex=this.value==='none'?-9:Number(this.value);save();draw()" style="width:100%"><option value="none" ${none?"selected":""}>比較なし</option>${hist.map((e,i)=>`<option value="${i}" ${!none&&i===ci?"selected":""}>${esc(e.date)} / ${Number(e.rating).toFixed(1)}</option>`).join("")}</select></label>`:"";
const col=d=>d>0?"var(--ac2)":d<0?"var(--dg)":"var(--mu)";
let head=`<div class="row" style="justify-content:center;gap:18px;margin:12px 0 0"><span>現在 <b style="font-size:24px;color:var(--ac)">${cr!=null?Number(cr).toFixed(1):"-"}</b></span>`;
if(prev&&cr!=null){const d=Math.round((cr-prev.rating)*10)/10;head+=`<span class="sub" style="margin:0">前回 ${Number(prev.rating).toFixed(1)}</span><b style="color:${col(d)}">${d>0?"▲ +":d<0?"▼ ":"± "}${d.toFixed(1)}</b>`}
head+="</div>";
const chips=prev&&Array.isArray(prev.answers)?RADAR_LABELS.map((l,i)=>{const d=cur[i]-prev.answers[i];return `<span class="chip" style="color:${col(d)}">${l} ${d>0?"▲+"+d:d<0?"▼"+Math.abs(d):"±0"}</span>`}).join(""):"";
return `${pick}${head}<div style="display:flex;justify-content:center">${radarSvg(name,cur,sel?300:250,prev?prev.answers:null)}</div><p class="sub" style="text-align:center"><span style="color:#6CA98B">● 現在</span>${prev?` <span style="color:#DEA45D">● 前回(${esc(prev.date)})</span>`:""}</p>${chips?`<div style="text-align:center">${chips}</div>`:'<p class="sub" style="text-align:center">評価を更新すると、前回との差がここに表示されます。</p>'}`}

return `<h2>招待リンク・PINの再設定</h2><p class="sub">メンバーごとに招待リンクを発行し、本人に送ります。本人はリンクを開いて、自分の4桁PINを決めます。ログインは「会員番号 + PIN」です（名前の打ち間違いが起きません）。PINを忘れたときも、ここで再発行します（再発行すると、そのメンバーはログアウトされます）。リンクは再表示できません。</p>${S.members.map(member=>{const st=PINST[member.n]||{},d=adminSetupCodeDisplay&&adminSetupCodeDisplay.name===member.n?adminSetupCodeDisplay:null;return `<div class="box"><div class="row" style="justify-content:space-between"><b>${memberIcon(member.n,24)} ${esc(member.n)}</b><span class="sub">会員番号 ${st.no||"-"} ／ ${st.pin?"PIN設定済み":st.setup?"招待発行済み":"未設定"}</span></div><button onclick="issueProfileSetupCode('${esc(member.n)}')">${st.pin||st.setup?"招待リンクを再発行":"招待リンクを発行"}</button>${d?`<p style="word-break:break-all"><b>招待リンク:</b><br>${esc(inviteLink(d.code))}</p><p class="sub">招待コード: ${esc(d.code)}（会員番号 ${esc(String(d.no))}）</p><div class="row"><button class="line-btn" onclick="shareInvite()">LINEで送る</button><button class="g" onclick="showCopy(inviteText())">コピー</button></div><p class="sub">この画面を離れると再表示されません。</p>`:""}</div>`}).join("")||'<p class="sub">先にメンバーを登録してください。</p>'}`
}
const inviteText=()=>{const d=adminSetupCodeDisplay;return d?`【PICKLE HUB 招待】\n${d.name}さん\n下のリンクを開いて、これから使う4桁のPINを決めてください。\n${inviteLink(d.code)}\n\n会員番号: ${d.no}（次回からは、会員番号とPINでログインできます）`:""};
const shareInvite=()=>shareTxt(inviteText());
async function issueProfileSetupCode(name){
try{const r=await rpc("admin_issue_code",{p_name:name});adminSetupCodeDisplay={name,code:r.code,no:r.no};logMemberUpdate(name,"招待リンク発行");await loadPinStatus();draw()}
catch(e){alert("発行できませんでした")}
}
function adminSettings(){return `<h2>管理者設定</h2><div class="box"><label>管理者パスワード変更</label><div class="row"><input id="new_pw" type="password" placeholder="新しいパスワード"><button onclick="changePw()">変更する</button></div></div><h2>自動バックアップ</h2><p class="sub">アプリを開いた最初の日ごとに自動で保存されます(直近7日分)。間違えて消したときは、ここから戻せます。</p><div class="box" id="bk_list"><p class="sub">読み込み中…</p></div>`}
function financeTotals(){const records=S.financeRecords||[],total=records.reduce((sum,item)=>({income:sum.income+item.income,expense:sum.expense+item.expense,profit:sum.profit+item.profit,fee:sum.fee+item.fee}),{income:0,expense:0,profit:0,fee:0});return `<div class="box"><div class="row" style="justify-content:space-between"><span>保存件数</span><b>${records.length}件</b></div><div class="row" style="justify-content:space-between"><span>累計総収入</span><b>${total.income.toLocaleString()}円</b></div><div class="row" style="justify-content:space-between"><span>累計総支出</span><b>${total.expense.toLocaleString()}円</b></div><div class="row" style="justify-content:space-between"><span>累計決済手数料</span><b>${total.fee.toLocaleString()}円</b></div><div class="row" style="justify-content:space-between"><span>累計差引利益</span><b>${total.profit.toLocaleString()}円</b></div></div>`}
function currentFinance(){const value=id=>Math.max(0,Number($(id)?.value)||0),price=value("b1"),participants=value("b2"),feeRate=Math.min(100,value("b5")),ticket=price*participants,fee=ticket*feeRate/100,sponsor=value("b4"),otherIncome=value("b6"),courtCost=value("b3"),otherCost=value("b7"),income=ticket+sponsor+otherIncome,expense=courtCost+otherCost+fee,profit=income-expense,denominator=price*(1-feeRate/100);return {name:$("bname")?.value.trim()||"大会",price,participants,ticket,feeRate,fee,sponsor,otherIncome,courtCost,otherCost,income,expense,profit,perPerson:participants?profit/participants:0,breakEven:denominator>0?Math.max(0,Math.ceil((courtCost+otherCost-sponsor-otherIncome)/denominator)):0}}
function saveFinanceRecord(){
const result=currentFinance();
if(!result.name.trim()){alert("大会名を入力してください");return}
if(result.participants<1){alert("参加人数を1人以上入力してください");return}
S.financeRecords=S.financeRecords||[];
 S.financeRecords.unshift({...result,date:new Date().toLocaleString("ja-JP")});
S.financeRecords=S.financeRecords.slice(0,100);save();toast("収支を保存しました");draw()
}
function loadFinanceRecord(index){const record=S.financeRecords[index];if(!record)return;S.bz=[0,record.price,record.participants,record.courtCost,record.sponsor,record.feeRate];S.adminForm=S.adminForm||{};S.adminForm.bname=record.name;S.adminForm.b6=record.otherIncome;S.adminForm.b7=record.otherCost;S.adminSheet="finance";save();draw()}
function deleteFinanceRecord(index){ask("この収支記録を削除しますか？",()=>{S.financeRecords.splice(index,1);save();draw()})}
function buildAdminPrompt(){
const kind=$("admin_kind").value==="recruit"?"練習・イベントの募集":"クラブのお知らせ";
rememberAdminTime();
const date=$("admin_event_date").value||"未入力";
const eventTime=$("admin_event_time").value||"未選択";
rememberAdminSuggestion("place");
const place=$("admin_place").value.trim()||"未入力";
const details=$("admin_details").value.trim()||"追加情報なし";
const prompt=`あなたは地域のピックルボールクラブの広報担当です。次の条件で、自然で読みやすい日本語の${kind}文を1案作成してください。\n目的: ${$("admin_goal").value}\n対象: ${$("admin_audience").value}\n文体: ${$("admin_tone").value}\n募集レベル: ${$("admin_level").value}\n開催日: ${date}\n開催時刻: ${eventTime}\n場所: ${place}\n追加情報: ${details}\n\n事実にない日時・場所・料金などは作らず、未記載の情報は書かないでください。絵文字は控えめにし、参加方法が伝わる文章にしてください。本文だけを出力してください。`;
$("admin_prompt").value=prompt;
return prompt
}
async function copyAdminPrompt(){
const prompt=buildAdminPrompt();
try{await navigator.clipboard.writeText(prompt);toast("AIへの依頼文をコピーしました")}catch(e){$("admin_prompt").focus();$("admin_prompt").select();toast("依頼文を選択しました。コピーしてAIに貼り付けてください")}
}
async function askAdminAI(){
buildAdminPrompt();
window.open("https://gemini.google.com/app","_blank","noopener");
await copyAdminPrompt();
toast("Geminiに依頼文を貼り付け、回答を下の欄に戻してください")
}
function publishAdminContent(){
const text=$("admin_draft").value.trim();
if(!text){alert("公開する文章を入力してください");return}
if($("admin_kind").value==="recruit"){
const capacity=Math.max(1,Math.min(99,parseInt($("admin_capacity").value,10)||1));
const eventDate=$("admin_event_date").value||"";
const eventTime=$("admin_event_time").value||"";
rememberAdminTime();
S.posts.unshift({w:text,l:$("admin_level").value,r:capacity,c:capacity,m:[],wl:[],dl:"",eventDate,eventTime,eventPlace:$("admin_place").value.trim()})
}else{S.news.unshift(text)}
save();draw();toast("投稿を公開しました")
}
function deleteAdminPost(i){ask("この募集を削除しますか？",()=>{S.posts.splice(i,1);save();draw()})}
function deleteAdminNews(i){ask("このお知らせを削除しますか？",()=>{S.news.splice(i,1);save();draw()})}
function adminSuggestionOptions(key){
return (S.adminSuggestions&&S.adminSuggestions[key]||[]).map(value=>`<option value="${esc(value)}"></option>`).join("")
}
function adminTimeOptions(){
const standard=Array.from({length:96},(_,i)=>`${String(Math.floor(i/4)).padStart(2,"0")}:${String(i%4*15).padStart(2,"0")}`);
const history=S.adminSuggestions&&S.adminSuggestions.eventTime||[];
const options=[...new Set([...history,...standard])];
const selected=S.adminForm&&S.adminForm.admin_event_time||"";
if(selected&&!options.includes(selected))options.unshift(selected);
return `<option value="" ${selected?"":"selected"}>時刻を選択</option>`+options.map(value=>`<option value="${esc(value)}" ${value===selected?"selected":""}>${esc(value)}</option>`).join("")
}
function rememberAdminTime(){
const field=$("admin_event_time");if(!field||!field.value)return;
S.adminSuggestions=S.adminSuggestions||{time:[],place:[],eventTime:[]};
const history=S.adminSuggestions.eventTime||[];
S.adminSuggestions.eventTime=[field.value,...history.filter(value=>value!==field.value)].slice(0,20);
save()
}
function rememberAdminSuggestion(key){
const input=$(key==="time"?"admin_time":"admin_place");
if(!input)return;
const value=input.value.trim();if(!value)return;
S.adminSuggestions=S.adminSuggestions||{time:[],place:[]};
const suggestions=S.adminSuggestions[key]||[];
S.adminSuggestions[key]=[value,...suggestions.filter(item=>item!==value)].slice(0,20);
const list=$(key==="time"?"admin_time_options":"admin_place_options");
if(list)list.innerHTML=adminSuggestionOptions(key);
save()
}
function duesOptions(){
const current=Math.max(0,parseInt(S.duesAmount,10)||0);
const amounts=Array.from({length:501},(_,i)=>i*100);
if(!amounts.includes(current))amounts.push(current);
return amounts.sort((a,b)=>a-b).map(amount=>`<option value="${amount}" ${amount===current?"selected":""}>${amount.toLocaleString()}円</option>`).join("")
}
const adminFormIds=["dues_amount","bname","b6","b7","event_title","event_date","event_time","event_end","event_level","event_place","event_capacity","event_details","admin_kind","admin_goal","admin_audience","admin_tone","admin_level","admin_place","admin_details","admin_capacity","admin_event_date","admin_event_time","admin_prompt","admin_draft"];
function captureAdminForm(){
const values={...(S.adminForm||{})};
let changed=false;
adminFormIds.forEach(id=>{const field=$(id);if(field){values[id]=field.value;changed=true}});
if(changed){S.adminForm=values;save()}
}
function restoreAdminForm(){
adminFormIds.forEach(id=>{const field=$(id);if(field&&S.adminForm&&S.adminForm[id]!=null)field.value=S.adminForm[id]});
adminFormIds.forEach(id=>{const field=$(id);if(field){field.addEventListener("input",captureAdminForm);field.addEventListener("change",captureAdminForm)}})
$("admin_event_time")?.addEventListener("change",rememberAdminTime);
$("admin_place")?.addEventListener("change",()=>rememberAdminSuggestion("place"));
}
function calcDues(){
const input=$("dues_amount");if(!input)return;
const amount=Math.max(0,parseInt(input.value,10)||0);S.duesAmount=amount;save();
const collected=S.members.filter(m=>m.paid).length*amount;
$("dues_collected").textContent=collected.toLocaleString()+"円";
$("dues_remaining").textContent=((S.members.length*amount)-collected).toLocaleString()+"円";
}
function toggleDues(i){S.members[i].paid=!S.members[i].paid;save();draw()}
function shareDues(){
const unpaid=S.members.filter(m=>!m.paid).map(m=>m.n);
if(!unpaid.length){alert("未納のメンバーはいません");return}
shareTxt("【会費のお知らせ】\n会費: "+(S.duesAmount||0).toLocaleString()+"円\n未納: "+unpaid.join("、")+"\nご確認をお願いします。")
}
function calcB(){
if(!$('b1'))return;
S.bz=[0,1,2,3,4,5].map(i=>i?+$("b"+i).value||0:0);save();
captureAdminForm();
const result=currentFinance(),yen=value=>Math.round(value).toLocaleString()+"円";
$("br_ticket").textContent=yen(result.ticket);$("br_sponsor").textContent=yen(result.sponsor);$("br_other_income").textContent=yen(result.otherIncome);$("br_income").textContent=yen(result.income);$("br_cost").textContent=yen(result.courtCost);$("br_other_cost").textContent=yen(result.otherCost);$("br_fee").textContent=yen(result.fee);$("br_expense").textContent=yen(result.expense);
const profit=$("bo");profit.textContent=yen(result.profit);profit.style.color=result.profit<0?"var(--dg)":"var(--ac2)";
$("br_per_person").textContent=yen(result.perPerson);
$("bs").textContent=`損益分岐点: ${result.breakEven.toLocaleString()}人 / ${result.participants.toLocaleString()}人参加時の収支`;
}

const monAnim=()=>themeGet().monAnim||"bob";
const mon=(k,size=120,anim)=>`<img class="mon-img mon-${anim||monAnim()}" src="${MONIMG[k]}" alt="${MONN[k]||""}" role="button" onclick="monTap(this,'${k}')" style="width:${size}px;animation-delay:${(Math.random()*1.2).toFixed(2)}s">`;
function monScene(){return `<div class="scene" role="group" aria-label="ピックルボールをするモンスターたち">${["pink","blue","orange","green"].map((k,i)=>`<img class="mon-img mon-${monAnim()}" src="${MONIMG[k]}" alt="${MONN[k]}" role="button" onclick="monTap(this,'${k}')" style="animation-delay:${i*.25}s">`).join("")}</div>`}
const mnote=(k,t)=>`<div style="text-align:center;padding:8px 0">${mon(k,130)}<p class="sub">${t}</p></div>`;
function monSay(el,t){const r=el.getBoundingClientRect();let b=document.getElementById("monb");if(!b){b=document.createElement("div");b.id="monb";b.setAttribute("role","status");document.body.appendChild(b)}
b.textContent=t;b.style.display="block";b.style.left=Math.min(Math.max(8,r.left+r.width/2-70),innerWidth-156)+"px";b.style.top=Math.max(8,r.top-46)+"px";clearTimeout(monSay.i);monSay.i=setTimeout(()=>{b.style.display="none"},1800)}
function monTap(el,k){el.classList.remove("mon-tap");void el.offsetWidth;el.classList.add("mon-tap");const a=MONSAY[k]||[""];monSay(el,a[Math.floor(Math.random()*a.length)])}
function monPlay(a){const d={hop2:"hop2 .7s",spin1:"spin1 .9s",shake:"shake .5s",cheer:"cheer 1.2s",dashs:"dashs 1.2s"}[a];document.querySelectorAll("#mstage img").forEach((im,i)=>{im.style.animation="none";void im.offsetWidth;im.style.animation=`${d} ease-in-out ${i*.12}s 1 both`;setTimeout(()=>{im.style.animation=""},2400)})}
function addTabMon(){const t=themeGet();if(t.mon===false)return;const h=document.querySelector("#app>h1"),k=TABMON[tab];if(!h||!k)return;
h.insertAdjacentHTML("beforeend",`<img class="h1-mon mon-${monAnim()}" src="${MONIMG[k]}" alt="${MONN[k]}" role="button" onclick="monTap(this,'${k}')" style="width:${Math.round(84*(+t.monSize||1))}px">`)}
let runT=null,runOn=false;
function runnerLoop(){clearTimeout(runT);if(!themeGet().runner||matchMedia("(prefers-reduced-motion:reduce)").matches){runOn=false;return}

const ks=["pink","blue","orange","green"],k=ks[Math.floor(Math.random()*ks.length)];el.src=MONIMG[k];el.style.display="block";el.classList.remove("run");void el.offsetWidth;el.classList.add("run")}
function runnerSync(){const t=themeGet();if(t.runner&&!runOn){runOn=true;runnerLoop()}else if(!t.runner){runOn=false;clearTimeout(runT);const el=document.getElementById("runner");if(el)el.style.display="none"}}

/* 1. メンバー登録 */
function sesStep1(){return `<p class="sub">その場にいる人の名前（ニックネーム）を入れて「追加」。メンバー画面で「出席」にした人は、自動で入ります。</p>
<div class="box"><div class="row"><input id="ses_name" data-keep maxlength="20" placeholder="なまえ" onkeydown="if(event.key==='Enter')sesAdd()" style="flex:1"><button onclick="sesAdd()">＋ 追加</button></div>
<div class="row" role="radiogroup" aria-label="レベル">${["b","i","a"].map(k=>`<button class="fchip ${SES.lv===k?"on":""}" role="radio" aria-checked="${SES.lv===k}" onclick="SES.lv='${k}';draw()">${LVT[k]}</button>`).join("")}</div></div>
<h2>参加メンバー（${S.players.length}人）</h2>
${S.players.map((n,i)=>`<div class="box" style="display:flex;align-items:center;gap:10px;margin:8px 0;padding:10px"><span>${popAvatar(n,40)}</span><b style="flex:1;word-break:break-all">${esc(n)}</b><button class="g" onclick="sesLv(${i})" aria-label="レベルを切り替え">${LVT[lvOf(n)]}</button><button class="x" onclick="sesDel(${i})" aria-label="${esc(n)}を削除">✕</button></div>`).join("")||mnote("green","まだ誰もいません。上のフォームから追加しましょう！")}
${S.players.length>=2?'<div class="row"><button onclick="SEV=2;draw()" style="width:100%">次へ：対戦ペアをつくる ➡️</button></div>':""}`}
function sesAdd(){const n=($("ses_name").value||"").trim();if(!n){alert("名前を入れてください");return}
if(S.players.some(p=>normName(p)===normName(n))){alert("同じ名前の人がすでにいます");return}
S.players.push(n);if(!isMember(n)){S.rt=S.rt||{};S.rt[n]=LVN[SES.lv]}
$("ses_name").value="";save();draw();const f=$("ses_name");if(f)f.focus()}
function sesLv(i){const n=S.players[i];if(isMember(n)){alert("メンバーのレベルは、プロフィールの自己評価が使われます");return}const o=["b","i","a"],k=o[(o.indexOf(lvOf(n))+1)%3];S.rt=S.rt||{};S.rt[n]=LVN[k];save();draw()}
function sesDel(i){const n=S.players[i];if(n==null)return;ask(`${n}さんを外します。この人の試合も消えます。よろしいですか？`,()=>{
const f=j=>j>i?j-1:j;
S.rounds=S.rounds.map(r=>({...r,m:r.m.filter(x=>![...x.a,...x.b].includes(i)).map(x=>({...x,a:x.a.map(f),b:x.b.map(f)})),bye:(r.bye||[]).filter(j=>j!==i).map(f)})).filter(r=>r.m.length);
S.players.splice(i,1);S.tournamentTeams=[];if(!isMember(n)&&S.rt)delete S.rt[n];SES.a=[null,null];SES.b=[null,null];save();draw()})}
/* 2. 対戦ペア作成 */
function sesSlots(){return SES.size===2?[["a",0],["a",1],["b",0],["b",1]]:[["a",0],["b",0]]}
function sesPick(i){const e=sesSlots().find(([t,k])=>SES[t][k]==null);if(!e){alert("枠がいっぱいです。「この対戦を追加」を押すか、枠をタップして外してください");return}SES[e[0]][e[1]]=i;draw()}
function sesClear(t,k){SES[t][k]=null;draw()}
function sesAddMatch(){const sl=sesSlots();if(sl.some(([t,k])=>SES[t][k]==null)){alert("すべての枠に人を入れてください");return}
const a=SES.a.filter(x=>x!=null),b=SES.b.filter(x=>x!=null);S.rounds.push({m:[{a:SES.size===2?a:[a[0]],b:SES.size===2?b:[b[0]],sa:"",sb:"",court:SES.court,manual:true}],bye:[]});
SES.a=[null,null];SES.b=[null,null];save();draw();toast("対戦を追加しました")}
function sesAuto(){const n=S.players.length;if(n<4){alert("4人以上いると、おまかせでペアを作れます");return}
const{g,pc,oc}=stats(),R=i=>(S.rt&&S.rt[S.players[i]])||3,K=(u,v)=>[u,v].sort((x,y)=>x-y).join(":"),byeC=S.players.map(()=>0);
S.rounds.forEach(r=>(r.bye||[]).forEach(i=>{if(byeC[i]!=null)byeC[i]++}));
const cap=Math.min(Math.max(1,S.courts),Math.floor(n/4))*4,play=[...Array(n).keys()].sort((a,b)=>g[a]-g[b]||byeC[b]-byeC[a]||Math.random()-.5).slice(0,cap),bye=[...Array(n).keys()].filter(i=>!play.includes(i));
let best=null,bs=Infinity;
for(let t=0;t<500;t++){const sh=play.slice().sort(()=>Math.random()-.5);let sc=0;const ms=[];
for(let i=0;i<sh.length;i+=4){const[a,b,x,y]=sh.slice(i,i+4);sc+=25*((pc[K(a,b)]||0)**2+(pc[K(x,y)]||0)**2);[[a,x],[a,y],[b,x],[b,y]].forEach(([u,v])=>sc+=(oc[K(u,v)]||0)**2*5);sc+=Math.abs(R(a)+R(b)-R(x)-R(y))*4;ms.push({a:[a,b],b:[x,y],sa:"",sb:"",court:i/4+1,manual:true})}
if(sc<bs){bs=sc;best=ms}}
S.rounds.push({m:best,bye});save();draw();toast("おまかせでペアを作りました 🎲")}
function sesDelMatch(r,m){ask("この対戦を削除します。よろしいですか？",()=>{const rd=S.rounds[r];if(!rd)return;rd.m.splice(m,1);if(!rd.m.length)S.rounds.splice(r,1);save();draw()})}
function matchList(){const o=[];S.rounds.forEach((r,ri)=>r.m.forEach((m,mi)=>o.push({r:ri,m:mi,x:m})));return o}
const isDone=x=>x.sa!==""&&x.sb!==""&&x.sa!==x.sb;
function sesStep2(){const used=new Set([...SES.a,...SES.b].filter(x=>x!=null)),list=matchList();
const slot=(t,k)=>{const i=SES[t][k];return `<button class="slot ${i!=null?"on":""}" onclick="${i!=null?`sesClear('${t}',${k})`:"void 0"}" aria-label="${i!=null?S.players[i]+"を外す":"空き枠"}">${i!=null?popName(i)+" ✕":"（空き）"}</button>`};
return `<p class="sub">下の名前をタップして、チームA・Bに入れましょう。迷ったら「おまかせ」！</p>
<div class="row"><button style="flex:1" onclick="sesAuto()">🎲 おまかせペア作成</button></div>
<div class="box"><div class="row" style="margin:0 0 8px"><label style="margin:0">人数 <select onchange="SES.size=+this.value;SES.a=[null,null];SES.b=[null,null];draw()"><option value="2" ${SES.size===2?"selected":""}>2人 vs 2人</option><option value="1" ${SES.size===1?"selected":""}>1人 vs 1人</option></select></label><label style="margin:0">コート <select onchange="SES.court=+this.value">${Array.from({length:Math.max(1,S.courts)},(_,i)=>`<option ${SES.court===i+1?"selected":""}>${i+1}</option>`).join("")}</select></label></div>
<div class="scgrid"><div><b>🟡 TEAM A</b>${slot("a",0)}${SES.size===2?slot("a",1):""}</div><div><b>🩷 TEAM B</b>${slot("b",0)}${SES.size===2?slot("b",1):""}</div></div>
<div class="hscroll" style="flex-wrap:wrap;overflow:visible">${S.players.map((n,i)=>`<button class="fchip" ${used.has(i)?"disabled":""} onclick="sesPick(${i})">${popAvatar(n,24)} ${esc(n)}</button>`).join("")||'<span class="sub">先にメンバーを登録してください</span>'}</div>
<div class="row"><button onclick="sesAddMatch()" style="width:100%">⚔️ この対戦を追加</button></div></div>
<h2>今日の対戦カード（${list.length}）</h2>
${list.map(o=>`<div class="box scard"><span class="stk ${isDone(o.x)?"":"r"}">${isDone(o.x)?"FINISHED 🏁":"結果待ち ⏳"}</span><div class="row" style="justify-content:space-between;margin:0"><b>COURT ${o.x.court||o.m+1}</b><button class="x" onclick="sesDelMatch(${o.r},${o.m})" aria-label="削除">✕</button></div><div class="scgrid" style="align-items:center"><div>${teamPop(o.x.a)}</div><div style="text-align:right">${teamPop(o.x.b)}</div></div></div>`).join("")||mnote("blue","まだ対戦がありません。「おまかせ」ならすぐ作れるよ！")}
${list.length?'<div class="row"><button onclick="SEV=3;draw()" style="width:100%">次へ：結果を入力する ➡️</button></div>':""}`}
/* 3. 結果入力・集計 */
function sesRank(){const t=table().filter(r=>r.g>0).map(r=>({...r,n:S.players[r.i],rate:r.w/r.g}));return t.sort((a,b)=>b.rate-a.rate||b.w-a.w||b.d-a.d)}
function sesResult(r,m){const a=$(`ra_${r}_${m}`).value.trim(),b=$(`rb_${r}_${m}`).value.trim();
if(a===""||b===""||isNaN(+a)||isNaN(+b)||+a<0||+b<0){alert("両チームの点数を入れてください（例: 11 と 8）");return}
if(+a===+b){alert("同点は入力できません。勝ったチームが上回るようにしてください");return}
const x=S.rounds[r]&&S.rounds[r].m[m];if(!x)return;x.sa=+a;x.sb=+b;save();draw();
const all=matchList();if(all.length&&all.every(o=>isDone(o.x)))toast("全試合終了！表彰を見てみよう 🏆")}
function sesStep3(){const list=matchList();
if(!list.length)return mnote("blue","まだ対戦がありません。")+'<div class="row"><button onclick="SEV=2;draw()">⚔️ 対戦ペアをつくる</button></div>';
const fin=list.filter(o=>isDone(o.x)),rank=sesRank(),maxW=rank.length?Math.max(...rank.map(r=>r.w)):0,top=rank.filter(r=>r.w===maxW&&maxW>0).map(r=>r.n),allDone=fin.length===list.length;
const medal=["🥇","🥈","🥉"];
return `<div class="scgrid" style="margin-top:12px"><div class="box scard"><span class="stk">総試合数</span><div class="big" style="text-align:center">${fin.length}<small style="font-size:14px">/${list.length}</small></div></div><div class="box scard"><span class="stk r">本日の最多勝 👑</span><div style="text-align:center;font-weight:900;font-size:18px;word-break:break-all">${top.length?esc(top.join("・")):"—"}</div><div class="sub" style="text-align:center;margin:0">${maxW?maxW+"勝":""}</div></div></div>
<h2>勝率ランキング</h2>${rank.length?`<table><tr><th>順位</th><th>名前</th><th>勝-敗</th><th>勝率</th><th>得失点</th></tr>${rank.map((r,k)=>`<tr><td class="medal">${medal[k]||"#"+(k+1)}</td><td>${popAvatar(r.n,26)} <b>${esc(r.n)}</b></td><td>${r.w}-${r.l}</td><td><b>${Math.round(r.rate*100)}%</b></td><td>${r.d>0?"+":""}${r.d}</td></tr>`).join("")}</table>`:'<p class="sub">結果を入力すると、ここに順位が出ます。</p>'}
<div class="row"><button style="width:100%;${allDone?"background:#F472B6":""}" onclick="openAwards()" ${fin.length?"":"disabled"}>${allDone?"🎉 全試合終了！表彰を見る 🏆":"🏆 表彰を見る"}</button></div>
<h2>結果を入力</h2>${list.map(o=>{const x=o.x,d=isDone(x),wa=d&&x.sa>x.sb,wb=d&&x.sb>x.sa;return `<div class="box scard"><span class="stk ${d?"":"r"}">${d?"FINISHED 🏁":"結果待ち ⏳"}</span><b>COURT ${x.court||o.m+1}</b>
<div class="scgrid" style="align-items:center;margin:8px 0"><div>${wa?"🏆 ":""}${teamPop(x.a)}</div><div style="text-align:right">${wb?"🏆 ":""}${teamPop(x.b)}</div></div>
<div class="row" style="justify-content:center"><input id="ra_${o.r}_${o.m}" class="sc" inputmode="numeric" value="${x.sa}" aria-label="チームAの点数" placeholder="A"><b>-</b><input id="rb_${o.r}_${o.m}" class="sc" inputmode="numeric" value="${x.sb}" aria-label="チームBの点数" placeholder="B"><button onclick="sesResult(${o.r},${o.m})">${d?"修正":"保存"}</button></div></div>`}).join("")}`}
/* 表彰 */
function confettiHtml(){const em=["🎉","🎊","⭐","🏆","✨","🎾"];return Array.from({length:28},(_,i)=>`<span class="cf" style="left:${Math.round(Math.random()*96)}vw;animation-delay:${(Math.random()*1.2).toFixed(2)}s">${em[i%em.length]}</span>`).join("")}
function awardsData(){const rank=sesRank();if(!rank.length)return[];const out=[],mvp=rank[0];out.push(["本日のMVP 🏆",[mvp.n],`${mvp.w}勝${mvp.l}敗（勝率${Math.round(mvp.rate*100)}%）`,"#FDE047"]);
const maxW=Math.max(...rank.map(r=>r.w));if(maxW>0)out.push(["最多勝 👑",rank.filter(r=>r.w===maxW).map(r=>r.n),maxW+"勝","#F472B6"]);
const perfect=rank.filter(r=>r.l===0&&r.g>=2);if(perfect.length)out.push(["全勝賞 🌟",perfect.map(r=>r.n),perfect[0].g+"戦全勝！","#67E8F9"]);
const maxG=Math.max(...rank.map(r=>r.g));out.push(["皆勤賞（いちばん遊んだ人）💪",rank.filter(r=>r.g===maxG).map(r=>r.n),maxG+"試合","#6EE7B7"]);return out}
function awardsText(){return "【今日のピックルボール 表彰】\n"+awardsData().map(([t,n,d])=>`${t}：${n.join("・")}（${d}）`).join("\n")}

document.body.appendChild(d);d.querySelector("#c").onclick=()=>d.remove();d.querySelector("#s").onclick=()=>shareTxt(awardsText());d.onclick=e=>{if(e.target===d)d.remove()}}

let SCS={t:11,mode:"d",sc:[0,0],srv:0,no:2,done:-1,hist:[],names:["TEAM A","TEAM B"],mi:-1},SC_DEMO=false;
function scReset(){SCS.sc=[0,0];SCS.srv=0;SCS.no=SCS.mode==="d"?2:1;SCS.done=-1;SCS.hist=[]}
function scSnap(){SCS.hist.push(JSON.stringify({sc:SCS.sc,srv:SCS.srv,no:SCS.no,done:SCS.done}))}
function scCheck(){const[a,b]=SCS.sc,t=SCS.t;SCS.done=a>=t&&a-b>=2?0:b>=t&&b-a>=2?1:-1}
function scRally(w){if(SCS.done>=0)return;scSnap();if(w===SCS.srv)SCS.sc[w]++;else if(SCS.mode==="d"&&SCS.no===1)SCS.no=2;else{SCS.srv=1-SCS.srv;SCS.no=1}scCheck();scDraw()}
function scAdj(t,d){if(SCS.done>=0&&d>0)return;scSnap();SCS.sc[t]=Math.max(0,SCS.sc[t]+d);scCheck();scDraw()}
function scUndo(){const h=SCS.hist.pop();if(!h)return;Object.assign(SCS,JSON.parse(h));scDraw()}
function scAsk(){ask("スコアを0-0に戻します。よろしいですか？",()=>{scReset();scDraw()})}

function scApply(){const lr=S.rounds[S.rounds.length-1],m=lr&&lr.m[SCS.mi];if(!m){alert("反映する試合を選んでください");return}m.sa=SCS.sc[0];m.sb=SCS.sc[1];save();toast("対戦表に反映しました")}

function scBody(){const q=SCS,col=i=>`<div class="scc ${q.srv===i?"srv":""}"><input class="scn" value="${esc(q.names[i])}" onchange="SCS.names[${i}]=this.value;scDraw()" aria-label="チーム名">

const lr=!SC_DEMO&&S.rounds&&S.rounds[S.rounds.length-1],sel=lr?`<label>対戦表の試合を選ぶ（任意）</label><select onchange="scPick(this.value)" style="width:100%"><option value="-1">手入力</option>${lr.m.map((m,i)=>`<option value="${i}" ${q.mi===i?"selected":""}>コート${i+1}: ${esc(teamPlain(m.a))} vs ${esc(teamPlain(m.b))}</option>`).join("")}</select>`:"";

img.onload=()=>{const M=1280,r=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);themeSet({img:c.toDataURL("image/jpeg",0.7),bg:"image"});draw()};
img.onerror=()=>{URL.revokeObjectURL(url);alert("この画像は読み込めませんでした")};img.src=url}
