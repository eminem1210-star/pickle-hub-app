<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PICKLE HUB - Pop Style</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg: #171D19;
  --sf: #202923;
  --sf2: #29352D;
  --ink: #E5EAE5;
  --mu: #9AA79C;
  --ln: #39473D;
  --ac: #83B394;
  --ac-glow: rgba(131, 179, 148, 0.18);
  --ac2: #8BC6A0;
  --on: #18221B;
  --dg: #E1847D;
  --warn: #C7A76A;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Zen Maru Gothic", sans-serif;
  font-size:15px;
  line-height:1.6;
  padding-bottom:90px;
}
main{max-width:680px;margin:0 auto;padding:20px 16px}
h1{
  font-size:26px;
  font-weight:900;
  margin:4px 0 2px;
  color: var(--ac);
  letter-spacing:.02em;
}
h2{
  font-size:16px;
  margin:28px 0 10px;
  font-weight:700;
  color: var(--ink);
  display:flex;
  align-items:center;
  gap:8px;
}
h2::before{
  content:"";
  width:8px;
  height:16px;
  background:var(--ac);
  border-radius:4px;
}
.sub{color:var(--mu);margin:0 0 14px;font-size:13px}
.badge{
  display:inline-block;
  padding:4px 12px;
  font-size:11px;
  font-weight:900;
  background:var(--ac);
  color:var(--on);
  border-radius:99px;
  box-shadow: 0 4px 10px var(--ac-glow);
}
.box{
  background:var(--sf);
  border:2px solid var(--ln);
  border-radius:20px;
  padding:18px;
  margin:12px 0;
  box-shadow: 0 8px 20px rgba(255, 107, 107, 0.08);
}
.court{
  border:2px solid var(--ln);
  border-radius:16px;
  margin:12px 0;
  background:var(--sf);
  overflow:hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.03);
}
.court .t{
  background:var(--ac);
  color:var(--on);
  font-size:12px;
  padding:6px 14px;
  font-weight:900;
  letter-spacing:.05em;
}
.court .m{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:16px;
}
.court .m>div:first-child,.court .m>div:last-child{font-weight:700;font-size:15px}
.court .m>div:last-child{text-align:right}
.court .m>div:nth-child(2){
  grid-column:1/-1;
  order:3;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  background: var(--sf2);
  padding: 8px;
  border-radius: 12px;
}
input,select,textarea{
  font:inherit;
  color:var(--ink);
  background:var(--sf);
  border:2px solid var(--ln);
  border-radius:12px;
  padding:10px 14px;
  min-width:0;
  transition: all 0.2s;
}
input:focus-visible,select:focus-visible,textarea:focus-visible{
  border-color:var(--ac);
  outline:none;
  box-shadow:0 0 0 4px var(--ac-glow);
}
input.sc{
  width:56px;
  text-align:center;
  padding:6px 2px;
  font-weight:900;
  font-size:20px;
  color:var(--ac);
}
button{
  font:inherit;
  font-weight:700;
  border:0;
  border-radius:14px;
  padding:12px 20px;
  background:var(--ac);
  color:var(--on);
  cursor:pointer;
  box-shadow:0 4px 15px var(--ac-glow);
  transition: transform 0.1s, filter 0.2s;
}
button:hover{filter:brightness(1.05);transform:translateY(-2px)}
button:active{transform:translateY(0)}
button.g{
  background:transparent;
  color:var(--ink);
  border:2px solid var(--ln);
  box-shadow:none;
}
button.g:hover{background:var(--sf2);border-color:var(--ac)}
button.x{
  background:transparent;
  color:var(--dg);
  padding:6px 10px;
  box-shadow:none;
}
button.pm{
  width:40px;
  height:40px;
  padding:0;
  font-size:22px;
  line-height:1;
  background: var(--sf);
  color: var(--ac);
  border: 2px solid var(--ln);
  box-shadow: none;
}
button.line-btn{
  background:#168A52;
  color:#F2FFF6;
  box-shadow:0 4px 15px rgba(22,138,82,0.2);
}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.row>input{flex:1}
.chip{
  display:inline-flex;
  align-items:center;
  background:var(--sf2);
  border:2px solid var(--ln);
  border-radius:99px;
  padding:6px 10px 6px 14px;
  margin:4px 4px 0 0;
  font-size:13px;
  font-weight:700;
}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:12px 8px;border-bottom:2px solid var(--ln);text-align:left}
th{color:var(--mu);font-weight:700;font-size:12px}
.big{font-size:44px;font-weight:900;color:var(--ac);font-variant-numeric:tabular-nums}
nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:rgba(32,41,35,0.94);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-top:2px solid var(--ln);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom,0px);
  z-index:5;
}
nav button{
  flex:1;
  background:transparent;
  color:var(--mu);
  border-radius:0;
  padding:14px 2px;
  font-size:13px;
  font-weight:700;
  border-top:4px solid transparent;
  box-shadow:none;
}
nav button[aria-selected=true]{
  color:var(--ac);
  border-top-color:var(--ac);
  background:var(--sf2);
}
.win{color:var(--ac2);font-weight:900}
.bye{color:var(--mu);font-size:13px;margin-top:6px}
.ok{color:var(--ac2);font-weight:700}
label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-top:12px}
#bg{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:20px}
#ts{
  position:fixed;
  left:16px;
  right:16px;
  bottom:calc(80px + env(safe-area-inset-bottom,0px));
  background:var(--ink);
  color:#FFF;
  padding:14px 18px;
  border-radius:16px;
  z-index:30;
  display:none;
  font-weight:700;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}
#dg{position:fixed;inset:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
#dg .box{width:100%;max-width:380px;background:var(--sf);border-radius:24px;border:1px solid var(--ln);box-shadow:0 20px 40px rgba(0,0,0,0.35)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:55vh;overflow:auto;padding:4px 2px;margin:10px 0}
.msg{max-width:86%}.msg.me{align-self:flex-end;text-align:right}.msg.ot{align-self:flex-start}
.bub{display:inline-block;text-align:left;white-space:pre-wrap;word-break:break-word;padding:10px 14px;border-radius:18px;background:var(--sf2);border:2px solid var(--ln)}
.msg.me .bub{background:var(--ac);color:var(--on);border-color:var(--ac)}
.meta{font-size:11px;color:var(--mu);margin-top:3px}.meta a{color:inherit;text-decoration:underline}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" role="tablist"></nav>
<script>
// --- Supabase 接続設定 ---
const SUPABASE_URL = 'https://slhfhxwddtxhqarkyldk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_6ai48uMR372DwW-K6Looxw_MIWT91mp';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TABS=[["ev","大会"],["events","イベント"],["bd","掲示板"],["cl","メンバー"],["mo","その他"]];
const MORE=[["pf","プロフィール"],["pr","練習"],["eq","貸出"],["rules","ルール"],["lv","レベル一覧"]];
let tab="pf",S={players:[],courts:2,rounds:[],posts:[],members:[],news:[],queue:[],rentals:[],feedbacks:[]};

// データの保存（Supabaseに書き込み ＆ localStorageにも一時保存）
const save = async () => {
  try {
    localStorage.setItem("ph_pop", JSON.stringify(S));
    await supabaseClient.from('app_state').upsert({ id: 'main_data', data: S });
  } catch(e) {
    console.error("保存エラー:", e);
  }
};

// 起動時にSupabaseからデータを読み込む ＆ リアルタイム購読のセットアップ
async function initApp() {
  try {
    const { data, error } = await supabaseClient.from('app_state').select('data').eq('id', 'main_data').single();
    if (data && data.data) {
      S = Object.assign(S, data.data);
    }
  } catch(e) {
    const r = localStorage.getItem("ph_pop");
    if(r) S = Object.assign(S, JSON.parse(r));
  }
  
  if(S.adminSetupCode){delete S.adminSetupCode; save();}
  syncClubPlayers();
  draw();
  setTimeout(()=>{if(tab=="bz")calcB()},0);

  // リアルタイム同期（他の人が変更したら自動で画面を更新）
  supabaseClient.channel('public:app_state')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'app_state', filter: 'id=eq.main_data' }, payload => {
      if (payload.new && payload.new.data) {
        S = payload.new.data;
        draw();
      }
    })
    .subscribe();
}

const $ = id => document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P=i=>`<span style="display:inline-flex;align-items:center;gap:6px;vertical-align:middle">${memberIcon(S.players[i]||"?",24)}<span>${esc(S.players[i]||"?")}</span></span>`;
let lastTab="",profileUnlockedName="",profileSessionName="",profilePhotoDraft="",levelDraft=null,profileAnswersEditedName="",profileBaseline=null,adminSetupCodeDisplay=null;
function localDateKey(date=new Date()){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`}
function checkTournamentDay(){
const today=localDateKey();
if(!S.tournamentDate){S.tournamentDate=today;save();return false}
if(S.tournamentDate===today)return false;
S.tournamentDate=today;S.players=[];S.rounds=[];S.clubPlayerNames=[];S.tournamentTeams=[];
syncClubPlayers();save();toast("日付が変わったため大会参加者とラウンドをリセットしました");
return true
}
function scheduleTournamentDayCheck(){
const now=new Date(),next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,0,1);
setTimeout(()=>{checkTournamentDay();draw();scheduleTournamentDayCheck()},next-now)
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&checkTournamentDay())draw()});
function toast(m){let t=$("ts");if(!t){t=document.createElement("div");t.id="ts";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=m;t.style.display="block";clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display="none",2500)}
window.alert=toast;
function ask(m,f){const d=document.createElement("div");d.id="dg";d.innerHTML='<div class="box"><p style="font-weight:700;font-size:16px;margin-bottom:16px;">'+esc(m)+'</p><div class="row"><button id="y">はい</button><button class="g" id="n">やめる</button></div></div>';document.body.appendChild(d);d.querySelector("#y").onclick=()=>{d.remove();f()};d.querySelector("#n").onclick=()=>d.remove()}
function showCopy(t){const d=document.createElement("div");d.id="dg";d.innerHTML='<div class="box"><p style="font-weight:700;">下の文章をコピーしてください</p><textarea rows="6" style="width:100%"></textarea><div class="row" style="margin-top:12px;"><button>閉じる</button></div></div>';const a=d.querySelector("textarea");a.value=t;d.querySelector("button").onclick=()=>d.remove();document.body.appendChild(d);a.select()}
function go(t){if(!["bz","bd"].includes(t))adminSession=false;if(tab==="bz"&&t!=="bz")adminSetupCodeDisplay=null;if(t!=="pf"){profileUnlockedName="";profilePhotoDraft=""}tab=t;draw()}
function draw(){
$("nav").innerHTML=TABS.map(([k,n])=>`<button role="tab" aria-selected="${k==tab||(k==='mo'&&MORE.some(m=>m[0]===tab))}" onclick="go('${k}')">${n}</button>`).join("")+`<button role="tab" onclick="checkAdmin()" style="font-size:11px;color:var(--mu);">🔒管理者</button>`;
  checkTournamentDay();
$("app").innerHTML = ({ev, events, pr, eq, lv, pf, rules, co, cl, bz, bd, mo})[tab]();
if(tab=="pr")showT();
if(tab=="bz")calcB();
if(lastTab!=tab){window.scrollTo(0,0);lastTab=tab}}

// 管理者画面（裏画面）へのアクセス関数
function checkAdmin(){
  const now=Date.now();
  if((S.adminLockUntil||0)>now){
    const unlockAt=new Date(S.adminLockUntil).toLocaleString("ja-JP");
    alert(`ログインを停止中です。${unlockAt}以降に再試行してください。`);
    return;
  }
  if(S.adminLockUntil){S.adminLockUntil=0;S.adminLoginFailures=0;save()}
  const d=document.createElement("div");
  d.id="dg";
  d.innerHTML=`<div class="box">
    <p style="font-weight:900;font-size:18px;color:var(--ac);margin-bottom:8px;">🔒 管理者ログイン</p>
    <p class="sub">パスワードを入力してください (初期値: 1234)</p>
    <input type="password" id="admin_pw" placeholder="パスワード" style="width:100%;margin-bottom:16px;" autofocus>
    <div class="row"><button id="login_btn" style="flex:1;">ログイン</button><button class="g" id="cancel_btn">閉じる</button></div>
  </div>`;
  document.body.appendChild(d);
  const input = d.querySelector("#admin_pw");
  input.focus();
  input.onkeydown = e => { if(e.key=='Enter') d.querySelector("#login_btn").click(); };
  d.querySelector("#login_btn").onclick=()=>{
    if(input.value==="1234" || input.value===(S.adminPw||"1234")){
      S.adminLoginFailures=0;
      S.adminLockUntil=0;
      save();
      d.remove();
      tab="bz";
      draw();
      adminSession=true;toast("管理者モードでログインしました");
    } else {
      S.adminLoginFailures=(S.adminLoginFailures||0)+1;
      if(S.adminLoginFailures>=3){
        S.adminLoginFailures=0;
        S.adminLockUntil=Date.now()+365*24*60*60*1000;
        save();
        d.remove();
        alert("3回間違えたため、ログインを1年間停止しました。アプリと保存データは削除されません。");
        return;
      }
      save();
      alert(`パスワードが違います（${3-S.adminLoginFailures}回間違えると1年間ロックされます）`);
      input.value="";
      input.focus();
    }
  };
  d.querySelector("#cancel_btn").onclick=()=>d.remove();
}

function shareTxt(t){if(navigator.share){navigator.share({text:t}).catch(e=>{if(e&&e.name!=="AbortError")showCopy(t)})}else{const w=window.open("https://line.me/R/share?text="+encodeURIComponent(t),"_blank");if(!w)showCopy(t)}}
function modSc(ri,mi,k,d){const m=S.rounds[ri].m[mi],c=m[k]===""?0:m[k];m[k]=Math.max(0,c+d);save();draw()}
function addRental(){const item=$("ri").value.trim(),member=$("rh").value;if(!item||!member){alert("用具名とメンバーを選択してください");return}S.rentals=S.rentals||[];S.rentals.push({item,holder:member});save();draw()}

/* ---------- 大会 ---------- */
function ev(){
return `<span class="badge">TOURNAMENT</span><h1>PICKLE HUB</h1><p class="sub">楽しくスマートに大会・練習を管理しよう！</p>
<div class="row"><label style="margin:0">大会形式 <select id="tournament_format" onchange="setTournamentFormat(this.value)"><option value="doubles" ${(S.tournamentFormat||"doubles")==="doubles"?"selected":""}>ダブルス</option><option value="singles" ${S.tournamentFormat==="singles"?"selected":""}>シングルス</option></select></label></div>
<h2>参加者 (${S.players.length}人)</h2>
<div class="row"><input id="pn" placeholder="名前 (例: 田中 3.5, 佐藤)" onkeydown="if(event.key=='Enter')addP()"><button onclick="addP()">追加</button></div>
<div>${S.players.map((p,i)=>`<span class="chip">${P(i)}${S.rt&&S.rt[p]!=null?' <small style="color:var(--ac)">'+Number(S.rt[p]).toFixed(1)+'</small>':''}<button class="x" aria-label="削除" onclick="delP(${i})">×</button></span>`).join("")||'<p class="sub">名前を入力して追加。「田中 3.5」のようにレベル指定も可能。</p><button class="g" onclick="demo()">✨ サンプル8人で試す</button>'}</div>
<div class="row"><label style="margin:0">コート数
<select id="cn" onchange="S.courts=+this.value;save()">${[1,2,3,4,5,6].map(n=>`<option ${n==S.courts?"selected":""}>${n}</option>`).join("")}</select></label>
<button onclick="nextRound()">次のラウンドを組む</button><button class="g" onclick="undoR()">直前取消</button><button class="g" onclick="resetEv()">全消去</button></div>
<div class="row"><button class="line-btn" onclick="shareR()">LINEで結果共有</button><button class="g" onclick="big()">大画面</button><button class="g" onclick="saveH()">履歴保存</button></div><textarea id="sh" rows="7" style="display:none;width:100%" aria-label="結果テキスト"></textarea>
${S.rounds.slice().reverse().map((r,ri)=>round(r,S.rounds.length-1-ri)).join("")}
${S.rounds.length?`<h2>順位表</h2>${stand()}`:""}
${(S.hist||[]).length?`<h2>過去の履歴</h2>${S.hist.map((h,i)=>`<div class="box"><b>${esc(h.d)}</b> (${h.p.length}人・${h.r.length}R)<div class="row"><button class="g" onclick="loadH(${i})">読み込む</button><button class="x" onclick="deleteH(${i})">履歴削除</button></div></div>`).join("")}`:""}`}
function addP(){const raw=$("pn").value.trim();if(!raw)return;S.rt=S.rt||{};raw.split(/[,、\n]+/).map(s=>s.trim()).filter(Boolean).forEach(s=>{const m=s.match(/^(.+?)\s+(\d(?:\.\d+)?)$/),n=m?m[1]:s;if(m)S.rt[n]=+m[2];if(!S.players.includes(n))S.players.push(n)});save();draw();$("pn").focus()}
function delP(i){const f=()=>{S.players.splice(i,1);S.rounds=[];S.tournamentTeams=[];save();draw()};S.rounds.length?ask("ラウンド記録が消えます。削除しますか？",f):f()}
function setTournamentFormat(format){
if(format===S.tournamentFormat)return;
const apply=()=>{S.tournamentFormat=format;S.rounds=[];S.tournamentTeams=[];save();draw()};
if(S.rounds.length){ask("大会形式を変更すると進行中のラウンドとスコアが消えます。変更しますか？",apply);const dialog=$("dg"),cancel=dialog&&dialog.querySelector("#n");if(cancel)cancel.onclick=()=>{dialog.remove();draw()}}
else{S.tournamentFormat=format;S.tournamentTeams=[];save();draw()}
}
function tournamentPlayers(){return S.players.map((_,index)=>index)}
function resetEv(){ask("ラウンドを全て消しますか？",()=>{S.rounds=[];S.tournamentTeams=[];syncClubPlayers();save();draw()})}
function syncClubPlayers(){
S.clubPlayerNames=Array.isArray(S.clubPlayerNames)?S.clubPlayerNames:[];
const attended=[...new Set(S.members.filter(member=>member.at).map(member=>member.n))];
if(S.rounds.length){
attended.forEach(name=>{if(!S.players.includes(name)){S.players.push(name);S.clubPlayerNames.push(name)}});
}else{
const remove=S.clubPlayerNames.filter(name=>!attended.includes(name));
S.players=S.players.filter(name=>!remove.includes(name));
S.clubPlayerNames=S.clubPlayerNames.filter(name=>attended.includes(name));
attended.forEach(name=>{if(!S.players.includes(name)){S.players.push(name);S.clubPlayerNames.push(name)}})
}
save()
}
function setAttendance(i){S.members[i].at=!S.members[i].at;syncClubPlayers();draw()}
function stats(){
const g=S.players.map(()=>0),pc={},oc={};
S.rounds.forEach(r=>r.m.forEach(m=>{[...m.a,...m.b].forEach(i=>g[i]++);
[m.a,m.b].forEach(t=>{const k=t.slice().sort()+"";pc[k]=(pc[k]||0)+1});
m.a.forEach(x=>m.b.forEach(y=>{const k=[x,y].sort()+"";oc[k]=(oc[k]||0)+1}))}));
return{g,pc,oc}}
function makeTournamentTeams(roster=tournamentPlayers()){
const ranked=roster.slice().sort((a,b)=>((S.rt&&S.rt[S.players[b]])||3)-((S.rt&&S.rt[S.players[a]])||3));
const teams=[];
while(ranked.length>=2)teams.push([ranked.shift(),ranked.pop()]);
if(ranked.length)teams.push([ranked[0]]);
S.tournamentTeams=teams;
return teams
}
function nextRound(force){
const roster=tournamentPlayers(),n=roster.length,singles=S.tournamentFormat==="singles";if(n<(singles?2:4)){alert(singles?"選択したレベル帯にシングルス参加者が2人以上必要です":"選択したレベル帯にダブルス参加者が4人以上必要です");return}
const lr=S.rounds[S.rounds.length-1];if(!force&&lr&&lr.m.some(m=>m.sa===""||m.sb==="")){ask("前のラウンドにスコア未入力の試合があります。このまま進みますか？",()=>nextRound(true));return}
const R=i=>(S.rt&&S.rt[S.players[i]])||3;
const{g,pc,oc}=stats(),byeCount=S.players.map(()=>0);
S.rounds.forEach(round=>round.bye.forEach(i=>{if(byeCount[i]!=null)byeCount[i]++}));
let matches=[],bye=[];
if(singles){
const matchCount=Math.min(Math.max(1,S.courts),Math.floor(n/2)),playingCount=matchCount*2;
const ordered=roster.map(i=>({i,g:g[i],rest:byeCount[i],tie:Math.random()})).sort((a,b)=>a.g-b.g||b.rest-a.rest||a.tie-b.tie);
const active=ordered.slice(0,playingCount).map(item=>item.i),activeSet=new Set(active);
bye=roster.filter(i=>!activeSet.has(i));
let best=null,bestScore=Infinity;
for(let attempt=0;attempt<500;attempt++){
const shuffled=active.slice().sort(()=>Math.random()-.5);let score=0,roundMatches=[];
for(let i=0;i<shuffled.length;i+=2){const a=shuffled[i],b=shuffled[i+1],key=[a,b].sort((x,y)=>x-y).join(":");score+=(oc[key]||0)**2*25+Math.abs(R(a)-R(b))*4;roundMatches.push({a:[a],b:[b],sa:"",sb:""})}
if(score<bestScore){bestScore=score;best=roundMatches}
}
matches=best||[];
}else{
const rosterSet=new Set(roster);
const validTeams=Array.isArray(S.tournamentTeams)&&S.tournamentTeams.length&&S.tournamentTeams.flat().length===n&&new Set(S.tournamentTeams.flat()).size===n&&S.tournamentTeams.flat().every(i=>rosterSet.has(i))&&S.tournamentTeams.every(team=>team.length===2&&team.every(i=>i>=0&&i<S.players.length));
if(n%2===0){
const teams=validTeams?S.tournamentTeams:makeTournamentTeams(roster);
const activeCount=Math.min(Math.max(1,S.courts),Math.floor(teams.length/2))*2;
const ordered=teams.map((team,index)=>({team,index,games:team.reduce((sum,i)=>sum+g[i],0),rest:team.reduce((sum,i)=>sum+byeCount[i],0),tie:Math.random()})).sort((a,b)=>a.games-b.games||b.rest-a.rest||a.tie-b.tie);
const active=ordered.slice(0,activeCount).map(item=>item.team),activeIds=new Set(active.flat());
bye=roster.filter(i=>!activeIds.has(i));
let best=null,bestScore=Infinity;
for(let attempt=0;attempt<500;attempt++){
const shuffled=active.slice().sort(()=>Math.random()-.5);let score=0,roundMatches=[];
for(let i=0;i<shuffled.length;i+=2){
const a=shuffled[i],b=shuffled[i+1];
const matchupKey=[a.join(":"),b.join(":")].sort().join("|");
let repeats=0;
S.rounds.forEach(round=>round.m.forEach(match=>{const key=[match.a.slice().sort((x,y)=>x-y).join(":"),match.b.slice().sort((x,y)=>x-y).join(":")].sort().join("|");if(key===matchupKey)repeats++}));
score+=repeats*30;
for(const x of a)for(const y of b){const key=[x,y].sort((u,v)=>u-v).join(":");score+=(oc[key]||0)**2*5}
score+=Math.abs(R(a[0])+R(a[1])-R(b[0])-R(b[1]))*4;
roundMatches.push({a:a.slice(),b:b.slice(),sa:"",sb:""})
}
if(score<bestScore){bestScore=score;best=roundMatches}
}
matches=best||[]
}else{
S.tournamentTeams=[];
const cap=Math.min(Math.max(1,S.courts),Math.floor(n/4))*4;
const play=roster.slice().sort((a,b)=>g[a]-g[b]||byeCount[b]-byeCount[a]||Math.random()-.5).slice(0,cap);
const playSet=new Set(play);bye=roster.filter(i=>!playSet.has(i));
let best=null,bestScore=Infinity;
for(let attempt=0;attempt<500;attempt++){
const shuffled=play.slice().sort(()=>Math.random()-.5);let score=0,roundMatches=[];
for(let i=0;i<shuffled.length;i+=4){
const [a,b,x,y]=shuffled.slice(i,i+4),pairKey=(u,v)=>[u,v].sort((p,q)=>p-q).join(":");
score+=25*((pc[pairKey(a,b)]||0)**2+(pc[pairKey(x,y)]||0)**2);
[[a,x],[a,y],[b,x],[b,y]].forEach(([u,v])=>score+=(oc[pairKey(u,v)]||0)**2*5);
score+=Math.abs(R(a)+R(b)-R(x)-R(y))*4;
roundMatches.push({a:[a,b],b:[x,y],sa:"",sb:""})
}
if(score<bestScore){bestScore=score;best=roundMatches}
}
matches=best||[]
}
}
S.rounds.push({m:matches,bye});save();draw()}

function table(){
const t=tournamentPlayers().map(i=>({i,w:0,l:0,d:0,g:0}));
S.rounds.forEach(r=>r.m.forEach(m=>{if(m.sa===""||m.sb==="")return;
const df=m.sa-m.sb;
m.a.forEach(i=>{t[i].g++;t[i].d+=df;df>0?t[i].w++:df<0&&t[i].l++});
m.b.forEach(i=>{t[i].g++;t[i].d-=df;df<0?t[i].w++:df>0&&t[i].l++})}));
return t.sort((a,b)=>b.w-a.w||b.d-a.d)}
function pairTable(){
const pairs={};
S.rounds.forEach(round=>round.m.forEach(match=>{
if(match.sa===""||match.sb==="")return;
[[match.a,match.sa,match.sb],[match.b,match.sb,match.sa]].forEach(([team,score,against])=>{
const ids=team.slice().sort((a,b)=>a-b),key=ids.join(":");
const pair=pairs[key]||(pairs[key]={ids,g:0,w:0,l:0,scored:0,against:0});
pair.g++;pair.scored+=+score;pair.against+=+against;
if(+score>+against)pair.w++;else if(+score<+against)pair.l++
})
}));

}

async function digestProfilePin(name,pin,salt){
if(!crypto.subtle)throw new Error("この環境では安全なPIN処理を利用できません");
const bytes=new TextEncoder().encode(`pickle-hub-profile-v1:${name}:${salt}:${pin}`);
const key=await crypto.subtle.importKey("raw",bytes,"PBKDF2",false,["deriveBits"]);
const saltBytes=new Uint8Array(salt.match(/.{2}/g).map(value=>parseInt(value,16)));
const digest=await crypto.subtle.deriveBits({name:"PBKDF2",salt:saltBytes,iterations:120000,hash:"SHA-256"},key,256);
return [...new Uint8Array(digest)].map(byte=>byte.toString(16).padStart(2,"0")).join("")
}
async function unlockProfile(){
const name=$("profile_member").value;if(!name){alert("メンバーを選択してください");return}
const profile=profileData(name);
if((profile.pinLockUntil||0)>Date.now()){alert("PIN入力を一時停止中です。しばらくしてから再試行してください。");draw();return}
if(profile.pinLockUntil){profile.pinLockUntil=0;profile.pinFailures=0;save()}
try{
if(profile.pinHash){
const pin=$("profile_pin").value;
if(!/^\d{4,8}$/.test(pin)){alert("PINを入力してください");return}
const hash=await digestProfilePin(name,pin,profile.pinSalt);
if(hash!==profile.pinHash){registerProfileAuthFailure(profile);return}
profile.pinFailures=0;profile.pinLockUntil=0;save()
}else{
if(!profile.setupCodeHash||profile.setupCodeUsed){alert("先に管理者から初回設定コードを発行してもらってください");return}
const code=$("profile_setup_code").value,newPin=$("profile_new_pin").value,confirm=$("profile_new_pin_confirm").value;
if(!/^\d{8}$/.test(code)){alert("8桁の初回設定コードを入力してください");return}
if(!/^\d{4}$/.test(newPin)||newPin!==confirm){alert("自分の4桁PINを2回同じ内容で入力してください");return}
const setupHash=await digestProfilePin(name,code,profile.setupSalt);
if(setupHash!==profile.setupCodeHash){registerProfileAuthFailure(profile,"初回設定コードが違います");return}
const salt=[...crypto.getRandomValues(new Uint8Array(16))].map(byte=>byte.toString(16).padStart(2,"0")).join("");
profile.pinSalt=salt;profile.pinHash=await digestProfilePin(name,newPin,salt);profile.pinLength=4;profile.setupCodeHash="";profile.setupCodeUsed=true;profile.setupSalt="";profile.pinFailures=0;profile.pinLockUntil=0;logMemberUpdate(name,"本人PIN初回設定");save()
}
profileUnlockedName=name;profileSessionName=name;S.profileMember=name;profileAnswersEditedName="";profileBaseline={rating:S.rt&&S.rt[name]!=null?Number(S.rt[name]):null,answers:(S.levelAnswers&&S.levelAnswers[name]||[]).slice(),bio:profile.bio||"",avatar:profile.avatar||""};save();draw()
}catch(error){alert(error.message||"PINを確認できませんでした")}
}
function registerProfileAuthFailure(profile,message="PINが違います"){
profile.pinFailures=(profile.pinFailures||0)+1;
if(profile.pinFailures>=5){profile.pinFailures=0;profile.pinLockUntil=Date.now()+5*60*1000}
save();alert(profile.pinLockUntil?"5回間違えたため5分間停止します":message);draw()
}

if(file.size>700*1024){alert("画像は700KB以下にしてください");input.value="";return}

function saveProfile(){
const name=$("profile_member").value;if(!name||profileUnlockedName!==name){alert("本人確認をしてください");return}
const profile=profileData(name),bio=$("profile_bio").value.trim(),nextPin=$("profile_new_pin").value,confirm=$("profile_new_pin_confirm").value;
if(nextPin||confirm){if(!/^\d{4}$/.test(nextPin)||nextPin!==confirm){alert("新しいPINを4桁で一致させてください");return}}
const updateRating=(!!levelDraft&&levelDraft.name===name)||profileAnswersEditedName===name;
let rating=null;
if(updateRating){
if(!levelDraft||levelDraft.name!==name){alert("質問の回答から目安を算出してください");return}
rating=Number($("profile_level_value").value);

}
const oldBio=profile.bio||"",oldAvatar=profile.avatar||"",oldRating=profileBaseline?.rating??(S.rt&&S.rt[name]);
const bioChanged=bio!==oldBio,avatarChanged=!!profilePhotoDraft&&profilePhotoDraft!==oldAvatar,ratingChanged=updateRating&&Number(oldRating)!==Math.round(rating*10)/10;
const newAnswers=S.levelAnswers&&S.levelAnswers[name]||[],oldAnswers=profileBaseline?.answers||[];
const answersChanged=updateRating&&JSON.stringify(newAnswers)!==JSON.stringify(oldAnswers);
if(updateRating&&Number.isFinite(Number(oldRating))&&(answersChanged||ratingChanged)){
S.levelHistory=S.levelHistory||{};S.levelHistory[name]=S.levelHistory[name]||[];
const previousAnswers=oldAnswers;
const snapshotAnswers=Array.isArray(previousAnswers)&&previousAnswers.length===5&&previousAnswers.every(Number.isFinite)?previousAnswers.slice():Array(5).fill(Number(oldRating));
S.levelHistory[name].push({date:new Date().toLocaleString("ja-JP"),rating:Number(oldRating),answers:snapshotAnswers});
}
profile.bio=bio;if(profilePhotoDraft)profile.avatar=profilePhotoDraft;
const persist=async()=>{if(updateRating){S.rt=S.rt||{};S.rt[name]=Math.round(rating*10)/10}if(nextPin){const salt=[...crypto.getRandomValues(new Uint8Array(16))].map(byte=>byte.toString(16).padStart(2,"0")).join("");profile.pinSalt=salt;profile.pinHash=await digestProfilePin(name,nextPin,salt);profile.pinLength=4}if(bioChanged||avatarChanged)logMemberUpdate(name,"プロフィール更新");if(ratingChanged||answersChanged)logMemberUpdate(name,"レベル自己評価更新");if(nextPin)logMemberUpdate(name,"プロフィールPIN変更");profileBaseline={rating:S.rt&&S.rt[name]!=null?Number(S.rt[name]):null,answers:(S.levelAnswers&&S.levelAnswers[name]||[]).slice(),bio:profile.bio||"",avatar:profile.avatar||""};save();profilePhotoDraft="";levelDraft=null;profileAnswersEditedName="";draw();toast("プロフィール・評価を保存しました")};
persist().catch(error=>alert(error.message||"プロフィールを保存できませんでした"))
}

function eventTimeOptions(selected=""){

async function issueProfileSetupCode(name){
const profile=profileData(name);
if(profile.pinHash){alert("このメンバーはすでにPIN設定済みです");return}
const bytes=crypto.getRandomValues(new Uint8Array(4));
const code=String(((bytes[0]<<24)|(bytes[1]<<16)|(bytes[2]<<8)|bytes[3])>>>0).padStart(10,"0").slice(-8);
const salt=[...crypto.getRandomValues(new Uint8Array(16))].map(byte=>byte.toString(16).padStart(2,"0")).join("");
profile.setupSalt=salt;profile.setupCodeHash=await digestProfilePin(name,code,salt);profile.setupCodeUsed=false;
adminSetupCodeDisplay={name,code};logMemberUpdate(name,"プロフィール初回設定コード発行");save();draw()
}
